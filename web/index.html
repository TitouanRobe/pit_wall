<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070b14" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      try {
        if (localStorage.getItem("pitwall-theme") === "light") {
          document.documentElement.dataset.theme = "light";
          document.documentElement.style.setProperty("--color-ink-950", "#f3f1ea");
          document.documentElement.style.setProperty("--color-bone", "#161a23");
        }
      } catch {}
    </script>
    <title>Pit Wall · LMU Telemetry</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
